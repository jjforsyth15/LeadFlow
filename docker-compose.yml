services:
    postgres: 
        image: postgres:16
        container_name: leadflow-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: leadflow
            POSTGRES_USER: leadflow_user
            POSTGRES_PASSWORD: leadflow_password
        ports:
            - "5433:5432"
        volumes:
            - leadflow_postgres_data:/var/lib/postgresql/data
volumes:
    leadflow_postgres_data: